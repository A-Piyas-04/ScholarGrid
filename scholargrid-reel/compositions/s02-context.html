<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #071018;
      font-family: Outfit, sans-serif;
      color: #f4f7fa;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(62, 224, 196, 0.16), transparent 55%),
        #071018;
    }
    #dotfield {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 900px;
      height: 900px;
      margin-left: -450px;
      margin-top: -450px;
    }
    .copy {
      position: absolute;
      left: 80px;
      right: 80px;
      top: 280px;
      text-align: center;
      z-index: 4;
    }
    .line {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .line .mute {
      color: rgba(244, 247, 250, 0.45);
    }
    .line .hi {
      color: #3ee0c4;
    }
    .arrow {
      margin: 22px auto 0;
      width: 48px;
      height: 48px;
      border-right: 4px solid #3ee0c4;
      border-bottom: 4px solid #3ee0c4;
      transform: rotate(45deg);
    }
  </style>
  <div id="root" data-composition-id="s02-context" data-width="1080" data-height="1920" data-motion-blur="on">
    <div class="bg" id="ctx-bg"></div>
    <svg id="dotfield" viewBox="0 0 900 900" aria-hidden="true"></svg>
    <div class="copy" id="ctx-copy">
      <div class="line" id="ctx-a"><span class="mute">Not a feed.</span></div>
      <div class="arrow" id="ctx-arrow"></div>
      <div class="line" id="ctx-b">A <span class="hi">landscape</span></div>
    </div>
  </div>
  <script>
    (function () {
      const svg = document.getElementById("dotfield");
      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(42);
      const ns = "http://www.w3.org/2000/svg";
      const dots = [];
      for (let i = 0; i < 160; i++) {
        const c = document.createElementNS(ns, "circle");
        const ang = rand() * Math.PI * 2;
        const rad = 40 + Math.pow(rand(), 0.65) * 380;
        const x = 450 + Math.cos(ang) * rad;
        const y = 450 + Math.sin(ang) * rad * 0.72;
        const r = 2 + rand() * 5.5;
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", r.toFixed(1));
        c.setAttribute("fill", rand() > 0.82 ? "#3ee0c4" : "rgba(244,247,250,0.55)");
        c.setAttribute("class", "dot");
        c.style.opacity = "0";
        svg.appendChild(c);
        dots.push(c);
      }
      for (let i = 0; i < 28; i++) {
        const l = document.createElementNS(ns, "line");
        const a = dots[Math.floor(rand() * dots.length)];
        const b = dots[Math.floor(rand() * dots.length)];
        l.setAttribute("x1", a.getAttribute("cx"));
        l.setAttribute("y1", a.getAttribute("cy"));
        l.setAttribute("x2", b.getAttribute("cx"));
        l.setAttribute("y2", b.getAttribute("cy"));
        l.setAttribute("stroke", "rgba(62,224,196,0.22)");
        l.setAttribute("stroke-width", "1");
        l.setAttribute("class", "edge");
        l.style.opacity = "0";
        svg.insertBefore(l, svg.firstChild);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#dotfield", { scale: 1.35, rotate: -8 }, { scale: 1, rotate: 0, duration: 3.9, ease: "power2.out" }, 0);
    tl.fromTo(".dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.008, ease: "power3.out" }, 0.1);
    tl.fromTo(".edge", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.02, ease: "power2.out" }, 0.55);

    tl.fromTo("#ctx-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.2);
    tl.fromTo("#ctx-arrow", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.55);
    tl.fromTo("#ctx-b", { opacity: 0, filter: "blur(8px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.22, ease: "power4.out" }, 0.75);

    tl.to("#ctx-copy", { y: -40, opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "power3.in" }, 3.95);
    tl.to("#dotfield", { scale: 1.45, opacity: 0.35, duration: 0.35, ease: "power3.in" }, 3.95);

    window.__timelines["s02-context"] = tl;
  </script>
</template>
