  <script>
    (function () {
      const svg = document.getElementById("map");
      const ns = "http://www.w3.org/2000/svg";
      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(99);
      const clusters = [
        { cx: 280, cy: 280, n: 55, color: "#3ee0c4" },
        { cx: 680, cy: 220, n: 48, color: "#7ad7ff" },
        { cx: 320, cy: 620, n: 42, color: "#9bffb0" },
        { cx: 720, cy: 680, n: 50, color: "#ffd27a" },
        { cx: 520, cy: 460, n: 28, color: "rgba(244,247,250,0.45)", sparse: true },
      ];
      clusters.forEach((cl, ci) => {
        for (let i = 0; i < cl.n; i++) {
          const c = document.createElementNS(ns, "circle");
          const ang = rand() * Math.PI * 2;
          const rad = Math.pow(rand(), 0.55) * (cl.sparse ? 110 : 95);
          c.setAttribute("cx", (cl.cx + Math.cos(ang) * rad).toFixed(1));
          c.setAttribute("cy", (cl.cy + Math.sin(ang) * rad * 0.85).toFixed(1));
          c.setAttribute("r", (cl.sparse ? 2.2 + rand() * 2 : 2.8 + rand() * 4).toFixed(1));
          c.setAttribute("fill", cl.color);
          c.setAttribute("class", "mdot c" + ci);
          c.style.opacity = "0";
          svg.appendChild(c);
        }
      });
      // growth arcs
      for (let i = 0; i < 3; i++) {
        const p = document.createElementNS(ns, "path");
        const y = 820 + i * 28;
        p.setAttribute("d", `M120 ${y} C 300 ${y - 40 - i * 10}, 520 ${y + 10}, 880 ${y - 55 - i * 18}`);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", "rgba(62,224,196,0.55)");
        p.setAttribute("stroke-width", "2.5");
        p.setAttribute("stroke-dasharray", "6 8");
        p.setAttribute("class", "garc");
        p.style.opacity = "0";
        svg.appendChild(p);
      }
    })();

    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#st2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.7);
    tl.fromTo("#st3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.95);

    tl.fromTo(".mdot.c0", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.01, ease: "power3.out" }, 1.2);
    tl.fromTo(".mdot.c1", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.01, ease: "power3.out" }, 1.55);
    tl.fromTo(".mdot.c2", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.01, ease: "power3.out" }, 1.9);
    tl.fromTo(".mdot.c3", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.01, ease: "power3.out" }, 2.25);
    tl.fromTo(".mdot.c4", { opacity: 0, scale: 0 }, { opacity: 0.85, scale: 1, duration: 0.4, stagger: 0.012, ease: "power3.out" }, 2.7);

    ["#lab1", "#lab2", "#lab3", "#lab4"].forEach((sel, i) => {
      tl.fromTo(sel, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 3.1 + i * 0.18);
    });

    tl.fromTo(".garc", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 5.2);
