<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"brand","type":"string","label":"Brand","default":"ScholarGrid"},
    {"id":"cta","type":"string","label":"CTA","default":"Explore the landscape"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #071018;
        --ink: #f4f7fa;
        --accent: #3ee0c4;
        --warn: #ff6b4a;
        --font-display: Outfit, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <!-- Voiceover: Kokoro-82M open-source TTS -->
      <audio
        id="vo"
        class="clip"
        src="assets/vo-norm.wav"
        data-start="0.35"
        data-duration="36.15"
        data-track-index="10"
        data-volume="1"
        data-fade-in="0.05"
        data-fade-out="0.15"
      ></audio>

      <!-- Music bed under VO -->
      <audio
        id="bed"
        class="clip"
        src="assets/bed.wav"
        data-start="0"
        data-duration="40"
        data-track-index="11"
        data-volume="0.14"
        data-fade-in="0.6"
        data-fade-out="1.2"
      ></audio>

      <!-- SFX hits -->
      <audio
        id="sfx-whoosh1"
        class="clip"
        src="assets/sfx/whoosh.wav"
        data-start="0.05"
        data-duration="1.9"
        data-track-index="12"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-whoosh2"
        class="clip"
        src="assets/sfx/whoosh2.wav"
        data-start="3.9"
        data-duration="1.1"
        data-track-index="12"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-rise"
        class="clip"
        src="assets/sfx/rise.wav"
        data-start="11.1"
        data-duration="1.3"
        data-track-index="12"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-pop"
        class="clip"
        src="assets/sfx/pop.wav"
        data-start="25.95"
        data-duration="0.2"
        data-track-index="12"
        data-volume="0.55"
      ></audio>
      <audio
        id="sfx-whoosh3"
        class="clip"
        src="assets/sfx/whoosh.wav"
        data-start="31.4"
        data-duration="1.9"
        data-track-index="12"
        data-volume="0.35"
      ></audio>

      <!-- Scenes timed to VO spine (~36s) + end hold to 40s -->
      <div
        id="s01-hook"
        class="scene-host clip"
        data-composition-id="s01-hook"
        data-composition-src="compositions/s01-hook.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s02-context"
        class="scene-host clip"
        data-composition-id="s02-context"
        data-composition-src="compositions/s02-context.html"
        data-start="3.7"
        data-duration="3.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s03-tension"
        class="scene-host clip"
        data-composition-id="s03-tension"
        data-composition-src="compositions/s03-tension.html"
        data-start="7.3"
        data-duration="4.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s04-mechanism"
        class="scene-host clip"
        data-composition-id="s04-mechanism"
        data-composition-src="compositions/s04-mechanism.html"
        data-start="11.1"
        data-duration="12.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s05-payoff"
        class="scene-host clip"
        data-composition-id="s05-payoff"
        data-composition-src="compositions/s05-payoff.html"
        data-start="23.6"
        data-duration="8.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s06-end"
        class="scene-host clip"
        data-composition-id="s06-end"
        data-composition-src="compositions/s06-end.html"
        data-start="31.4"
        data-duration="8.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
